<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweep'em</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body onload="onInitGame()" onkeydown="handleKey(event)">
    <h1>💥 CA - Mine Sweeper! 💥</h1>

    <div class="game-container">
        <div class="dashboard">
            <h3 class="lives">LIVES <span class="lives-count">0</span></h3>
            <div class="stats-group">
                <button class="status-button-smiley" onclick="resetGame(true)"></button>
                <div class="hint-container"></div>
                <button class="undo-button" onclick="undo()">
                    Undo
                    ↩
                </button>
                <h3 class="timer">Time: <span class="seconds">0</span>s</h3>
            </div>
        </div>

        <table class="game-table"> </table>
        <div class="game-over-modal hidden">
            <h2 class="game-over-title"></h2>
            <p>The game is officially over!</p>
            <button onclick="resetGame(false)">Restart?</button>
        </div>

    </div>

    <footer>
        <p>Created with 💥 by <strong>Omer D. Tito (Y)</strong></p>
    </footer>

    <script src="js/scripts.js"></script>
    <script src="js/utils.js"></script>
</body>

</html>
